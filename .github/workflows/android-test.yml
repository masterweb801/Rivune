name: Android Test Build

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Build and verify test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RIVUNE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Missing RIVUNE_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rivune-release.jks"
          test -s "$RUNNER_TEMP/rivune-release.jks"

      - name: Build signed test APK
        env:
          RIVUNE_STORE_FILE: ${{ runner.temp }}/rivune-release.jks
          RIVUNE_STORE_PASSWORD: ${{ secrets.RIVUNE_STORE_PASSWORD }}
          RIVUNE_KEY_ALIAS: ${{ secrets.RIVUNE_KEY_ALIAS }}
          RIVUNE_KEY_PASSWORD: ${{ secrets.RIVUNE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RIVUNE_STORE_PASSWORD"
          test -n "$RIVUNE_KEY_ALIAS"
          test -n "$RIVUNE_KEY_PASSWORD"
          gradle --no-daemon clean assembleRelease

      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED="dc44ed95e4597b953fd4d335c4a0587f9d8c4f27c964bf9750df18a3e9e2bfdf"
          ACTUAL=$(apksigner verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($2); exit}')
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Test APK signing certificate does not match the installed RIVUNE app."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Signing certificate matches the installed RIVUNE app."

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: rivune-dev-test-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
