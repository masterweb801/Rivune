name: Android Release

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify release tag matches app version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          if [[ -z "$VERSION_NAME" ]]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          if [[ "V$VERSION_NAME" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version V$VERSION_NAME"
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RIVUNE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Missing RIVUNE_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rivune-release.jks"
          test -s "$RUNNER_TEMP/rivune-release.jks"

      - name: Build signed release APK
        env:
          RIVUNE_STORE_FILE: ${{ runner.temp }}/rivune-release.jks
          RIVUNE_STORE_PASSWORD: ${{ secrets.RIVUNE_STORE_PASSWORD }}
          RIVUNE_KEY_ALIAS: ${{ secrets.RIVUNE_KEY_ALIAS }}
          RIVUNE_KEY_PASSWORD: ${{ secrets.RIVUNE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RIVUNE_STORE_PASSWORD"
          test -n "$RIVUNE_KEY_ALIAS"
          test -n "$RIVUNE_KEY_PASSWORD"
          gradle --no-daemon clean assembleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RIVUNE ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
